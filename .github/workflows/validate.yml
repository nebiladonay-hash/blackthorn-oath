name: Validate BLACKTHORN OATH Godot project

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: godot-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot 4.4.1
        shell: bash
        run: |
          set -euo pipefail
          URL="https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip"
          curl --fail --location --retry 3 "$URL" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot-bin
          sudo install -m 0755 /tmp/godot-bin/Godot_v4.4.1-stable_linux.x86_64 /usr/local/bin/godot
          godot --version

      - name: Download external CC0 cathedral asset
        shell: bash
        run: bash scripts/download_assets.sh

      - name: Import project and reject script parse errors
        shell: bash
        run: |
          set -o pipefail
          godot --headless --editor --path . --quit 2>&1 | tee /tmp/godot-import.log
          if grep -E "SCRIPT ERROR:|Parse Error:|Failed to load script" /tmp/godot-import.log; then
            echo "::error::Godot reported a script import or parse error."
            exit 1
          fi

      - name: Run main scene smoke check
        shell: bash
        run: |
          set -o pipefail
          timeout 30s godot --headless --path . --quit-after 180 2>&1 | tee /tmp/godot-smoke.log
          if grep -E "SCRIPT ERROR:|Parse Error:|Failed to load script" /tmp/godot-smoke.log; then
            echo "::error::Godot reported a runtime script error."
            exit 1
          fi

      - name: Capture cinematic intro frames with software rendering
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y xvfb
          timeout 45s xvfb-run -a -s "-screen 0 1280x720x24" env LIBGL_ALWAYS_SOFTWARE=1 godot --path . --script res://tests/capture_intro.gd 2>&1 | tee /tmp/godot-visual.log
          grep -F "VISUAL_REVIEW_COMPLETE" /tmp/godot-visual.log
          test -s build/visual_review/01-cathedral-aerial.png
          test -s build/visual_review/02-bell-warden-gate-reveal.png
          test -s build/visual_review/03-knight-reveal.png
          test -s build/visual_review/04-title-and-start-screen.png

      - name: Upload cinematic visual review
        uses: actions/upload-artifact@v4
        with:
          name: BLACKTHORN-OATH-visual-review
          path: build/visual_review/*.png
          if-no-files-found: error
          retention-days: 7
