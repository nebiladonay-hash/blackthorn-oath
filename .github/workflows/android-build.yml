name: Build BLACKTHORN OATH Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags: [ 'prototype-*' ]

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - uses: actions/checkout@v4
      - name: Import project
        run: godot --headless --editor --path . --quit
      - name: Verify Android export preset
        run: godot --headless --path . --export-debug "Android" build/BLACKTHORN-OATH-debug.apk
      - name: Check APK output
        run: test -s build/BLACKTHORN-OATH-debug.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BLACKTHORN-OATH-Android-debug
          path: build/BLACKTHORN-OATH-debug.apk
          if-no-files-found: error
          retention-days: 7
